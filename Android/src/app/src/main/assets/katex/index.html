<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #000;
    background: transparent;
  }
  .katex { font-size: 1.1em; }
  .math-block { display: block; margin: 8px 0; text-align: center; }
  .math-inline { display: inline; }
  pre { white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<div id="content"></div>
<script>
function renderMath(text) {
  // Normalize delimiters: \(...\) -> $...$, \[...\] -> $$...$$
  text = text.replace(/\\\(/g, '$').replace(/\\\)/g, '$');
  text = text.replace(/\\\[/g, '$$').replace(/\\\]/g, '$$');

  // Split by $$ for block math and $ for inline math
  var parts = [];
  var regex = /\$\$([\s\S]*?)\$\$|\$([^$\n]+?)\$/g;
  var lastIndex = 0;
  var match;

  while ((match = regex.exec(text)) !== null) {
    if (match.index > lastIndex) {
      parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
    }
    if (match[1] !== undefined) {
      parts.push({ type: 'block', content: match[1] });
    } else {
      parts.push({ type: 'inline', content: match[2] });
    }
    lastIndex = regex.lastIndex;
  }
  if (lastIndex < text.length) {
    parts.push({ type: 'text', content: text.substring(lastIndex) });
  }

  var html = '';
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (p.type === 'text') {
      html += p.content.replace(/\n/g, '<br>');
    } else if (p.type === 'block') {
      try {
        html += '<div class="math-block">' + katex.renderToString(p.content, { displayMode: true, throwOnError: false }) + '</div>';
      } catch (e) {
        html += '<pre>' + p.content + '</pre>';
      }
    } else {
      try {
        html += katex.renderToString(p.content, { displayMode: false, throwOnError: false });
      } catch (e) {
        html += p.content;
      }
    }
  }
  document.getElementById('content').innerHTML = html;
}

// Listen for messages from Android
window.renderMath = renderMath;
</script>
</body>
</html>
